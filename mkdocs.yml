  - search
  - meta
  - git-authors
  - git-revision-date-localized:
      fallback_to_build_date: true
  - git-committers:
      repository: serhioromano/gxw2-st-course
      branch: main
      token: !ENV GH_TOKEN

markdown_extensions:
  - abbr
  - tables
  - admonition
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - def_list
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.tasklist:
      custom_checkbox: true

